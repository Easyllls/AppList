<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<meta name="description" content="AppList · Android、Android TV、Windows 及 Root / Xposed 软件资源列表">
<title>AppList · 软件资源列表</title>
<link rel="icon" href="./icon/ai.png">
<style>
:root{
  --bg:#f6f7f9;
  --card:#fff;
  --text:#202124;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#2563eb;
  --primary-bg:#eff6ff;
  --hover:#f8fafc;
  --shadow:0 4px 18px rgba(0,0,0,.05);
  --radius:16px;
}
html.dark{
  --bg:#0f1115;
  --card:#171a21;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --line:#2a2f38;
  --primary:#60a5fa;
  --primary-bg:#172554;
  --hover:#1c222c;
  --shadow:0 5px 22px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Roboto,Arial,sans-serif;
  line-height:1.65;
}
a{color:var(--primary);text-decoration:none}
button,input{font:inherit}
.header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(18px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1180px;
  margin:auto;
  min-height:68px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:max-content;
  color:var(--text);
  font-weight:800;
}
.brand img{
  width:38px;height:38px;border-radius:10px;
  object-fit:cover;
}
.brand span{font-size:18px}
.search{
  flex:1;
  min-width:120px;
  max-width:520px;
  margin-left:auto;
  position:relative;
}
.search input{
  width:100%;
  height:42px;
  padding:0 16px 0 42px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  color:var(--text);
  background:var(--card);
}
.search input:focus{border-color:var(--primary)}
.search-icon{
  position:absolute;left:14px;top:10px;
  color:var(--muted);font-size:18px;
}
.actions{display:flex;gap:8px}
.icon-btn{
  width:42px;height:42px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}
.icon-btn:hover{background:var(--hover)}
.container{
  max-width:1180px;
  margin:auto;
  padding:28px 18px 70px;
}
.hero{
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:center;
  padding:28px;
  margin-bottom:24px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
}
.hero h1{margin:0 0 8px;font-size:32px;line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.hero img{
  width:120px;height:120px;border-radius:24px;
  object-fit:cover;
}
.platform-nav{
  position:sticky;
  top:69px;
  z-index:30;
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0 14px;
  margin-bottom:6px;
  scrollbar-width:none;
}
.platform-nav::-webkit-scrollbar{display:none}
.nav-link{
  flex:0 0 auto;
  padding:8px 14px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--text);
  background:var(--card);
  font-size:14px;
}
.nav-link:hover{border-color:var(--primary);color:var(--primary)}
.platform{
  scroll-margin-top:140px;
  margin-top:26px;
}
.platform-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 14px;
  font-size:26px;
}
.platform-title .count{
  color:var(--muted);
  font-size:13px;
  font-weight:500;
}
.content-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.category{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.category-head{
  padding:17px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  cursor:pointer;
  user-select:none;
}
.category-head:hover{background:var(--hover)}
.category-name{font-size:18px;font-weight:750}
.category-meta{color:var(--muted);font-size:12px}
.category-body{
  border-top:1px solid var(--line);
  padding:4px 18px 10px;
}
.app{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.app:last-child{border-bottom:0}
.app-title{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:16px;
  font-weight:650;
}
.app-desc{
  margin:4px 0 0;
  color:var(--muted);
  font-size:14px;
}
.downloads{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}
.download{
  display:inline-flex;
  padding:3px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:12px;
  color:var(--primary);
  background:var(--primary-bg);
}
.download:hover{border-color:var(--primary)}
.loose-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin-top:14px;
}
.top-level-app{
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
}
.top-level-app:hover{
  border-color:var(--primary);
  background:var(--hover);
}
.empty,.error,.loading{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}
.error{
  color:#dc2626;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.footer{
  margin-top:50px;
  padding-top:22px;
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
.markdown-extra{
  margin-bottom:24px;
  color:var(--muted);
}
.markdown-extra p{margin:6px 0}
.markdown-extra img{max-width:100%;height:auto}
.markdown-extra .repo-badges{display:none}
.no-result{display:none}
@media(max-width:760px){
  .header-inner{padding:9px 12px}
  .brand span{display:none}
  .search{max-width:none}
  .container{padding:18px 12px 50px}
  .hero{grid-template-columns:1fr;padding:22px}
  .hero img{display:none}
  .hero h1{font-size:27px}
  .content-grid,.loose-grid{grid-template-columns:1fr}
  .platform-nav{top:60px}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a class="brand" href="#">
      <img src="./icon/ai.png" alt="AppList">
      <span>AppList</span>
    </a>
    <div class="search">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" placeholder="搜索应用、分类……" autocomplete="off">
    </div>
    <div class="actions">
      <button class="icon-btn" id="github" title="GitHub">↗</button>
      <button class="icon-btn" id="theme" title="切换主题">☾</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div>
      <h1>AppList</h1>
      <p>Android、Android TV、Windows 及 Root / Xposed 软件资源列表</p>
    </div>
    <img src="./icon/ai.png" alt="AppList">
  </section>

  <nav id="platformNav" class="platform-nav"></nav>
  <div id="app"></div>

  <footer class="footer">
    数据来源：
    <a href="https://github.com/Easyllls/AppList" target="_blank" rel="noopener">GitHub · Easyllls/AppList</a>
    · README.md
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const README_URL =
  "https://raw.githubusercontent.com/Easyllls/AppList/main/README.md";
const REPO_URL =
  "https://github.com/Easyllls/AppList";

const appRoot = document.getElementById("app");
const navRoot = document.getElementById("platformNav");
const searchInput = document.getElementById("search");

document.getElementById("github").onclick = () => {
  location.href = REPO_URL;
};

const savedTheme = localStorage.getItem("applist-theme");
if (
  savedTheme === "dark" ||
  (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)
) {
  document.documentElement.classList.add("dark");
}
updateThemeIcon();

document.getElementById("theme").onclick = () => {
  document.documentElement.classList.toggle("dark");
  localStorage.setItem(
    "applist-theme",
    document.documentElement.classList.contains("dark") ? "dark" : "light"
  );
  updateThemeIcon();
};

function updateThemeIcon(){
  document.getElementById("theme").textContent =
    document.documentElement.classList.contains("dark") ? "☀" : "☾";
}

function cleanText(text){
  return (text || "")
    .replace(/\u00a0/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function slug(text){
  return "p-" + text.toLowerCase()
    .replace(/[^\w\u4e00-\u9fff]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function escapeHtml(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function getDirectList(parent){
  return [...parent.children].find(
    el => el.tagName === "UL" || el.tagName === "OL"
  );
}

function getDirectLinks(li){
  return [...li.children]
    .filter(el => el.tagName === "A")
    .map(a => ({
      name: cleanText(a.textContent),
      href: a.href
    }));
}

function getItemTitle(li){
  const directLinks = getDirectLinks(li);
  if(directLinks.length) return directLinks[0].name;

  const clone = li.cloneNode(true);
  clone.querySelectorAll("ul,ol").forEach(x => x.remove());
  return cleanText(clone.textContent);
}

function getItemDescription(li){
  const clone = li.cloneNode(true);
  clone.querySelectorAll("ul,ol,a").forEach(x => x.remove());
  return cleanText(clone.textContent);
}

function parseApps(list){
  if(!list) return [];

  return [...list.children]
    .filter(li => li.tagName === "LI")
    .map(li => {
      const links = getDirectLinks(li);
      const nested = getDirectList(li);
      return {
        name: getItemTitle(li),
        description: getItemDescription(li),
        links,
        nested
      };
    });
}

function parseDetails(details){
  const summary = details.querySelector(":scope > summary");
  const list = getDirectList(details);
  if(!summary || !list) return null;

  const platform = cleanText(summary.textContent);
  const items = parseApps(list);
  const categories = [];
  const loose = [];

  items.forEach(item => {
    if(item.nested){
      categories.push({
        name: item.name,
        links: item.links,
        apps: parseApps(item.nested)
      });
    }else{
      loose.push(item);
    }
  });

  return {name: platform, categories, loose};
}

function parseMarkdownLinks(text){
  const links = [];
  const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
  let match;

  while((match = re.exec(text))){
    links.push({
      name: cleanText(match[1]),
      href: match[2]
    });
  }

  return links;
}

function stripMarkdownLinks(text){
  return cleanText(
    text
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, "$1")
      .replace(/<[^>]+>/g, "")
  );
}

function parseMarkdownItem(line){
  const match = line.match(/^\s*-\s+(.*)$/);
  if(!match) return null;

  const raw = match[1];
  const links = parseMarkdownLinks(raw);
  const withoutLinks = stripMarkdownLinks(raw);

  let name = links.length ? links[0].name : withoutLinks;
  let description = withoutLinks;

  if(links.length){
    description = cleanText(
      withoutLinks
        .replace(new RegExp("^" + name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")), "")
        .replace(/^[:：]\s*/, "")
    );
  }

  return {
    name,
    description,
    links,
    indent: line.match(/^\s*/)[0].length
  };
}

function parseREADME(markdown){
  const lines = markdown.replace(/\r\n/g,"\n").split("\n");
  const platforms = [];

  let inDetails = false;
  let platform = null;
  let topItems = [];
  let currentCategory = null;

  function finishPlatform(){
    if(!platform) return;

    platform.categories = [];
    platform.loose = [];

    topItems.forEach(item => {
      if(item.children.length){
        platform.categories.push({
          name: item.name,
          description: item.description,
          links: item.links,
          apps: item.children.map(child => ({
            name: child.name,
            description: child.description,
            links: child.links
          }))
        });
      }else{
        platform.loose.push({
          name: item.name,
          description: item.description,
          links: item.links
        });
      }
    });

    platforms.push(platform);
    platform = null;
    topItems = [];
    currentCategory = null;
  }

  for(const line of lines){
    const trimmed = line.trim();

    const summaryMatch = trimmed.match(
      /^<summary[^>]*>([\s\S]*?)<\/summary>$/i
    );

    if(summaryMatch){
      finishPlatform();

      platform = {
        name: stripMarkdownLinks(summaryMatch[1])
          .replace(/<[^>]*>/g,"")
          .trim(),
        categories: [],
        loose: []
      };

      inDetails = true;
      continue;
    }

    if(inDetails && /^<\/details>/i.test(trimmed)){
      finishPlatform();
      inDetails = false;
      continue;
    }

    if(!inDetails || !platform) continue;

    const item = parseMarkdownItem(line);
    if(!item) continue;

    // README 中平台下的第一层列表项为分类或无分类应用。
    // 缩进超过第一层的列表项属于该分类。
    if(item.indent <= 2){
      item.children = [];
      topItems.push(item);
      currentCategory = item;
    }else if(currentCategory){
      if(!currentCategory.children) currentCategory.children = [];
      currentCategory.children.push(item);
    }
  }

  finishPlatform();

  return platforms;
}

function makeDownloads(links){
  if(!links || links.length <= 1) return "";
  return `
    <div class="downloads">
      ${links.slice(1).map(link =>
        `<a class="download" href="${escapeHtml(link.href)}"
            target="_blank" rel="noopener">${escapeHtml(link.name || "下载")}</a>`
      ).join("")}
    </div>`;
}

function makeApp(item){
  const el = document.createElement("article");
  el.className = "app";

  const mainLink = item.links?.[0];

  const title = mainLink
    ? `<a class="app-title" href="${escapeHtml(mainLink.href)}"
          target="_blank" rel="noopener">${escapeHtml(item.name)}</a>`
    : `<span class="app-title">${escapeHtml(item.name)}</span>`;

  el.innerHTML = `
    ${title}
    ${item.description
      ? `<div class="app-desc">${escapeHtml(item.description)}</div>`
      : ""}
    ${makeDownloads(item.links)}
  `;

  return el;
}

function makeCategory(category){
  const box = document.createElement("section");
  box.className = "category";

  const head = document.createElement("div");
  head.className = "category-head";

  const body = document.createElement("div");
  body.className = "category-body";

  head.innerHTML = `
    <span class="category-name">${escapeHtml(category.name)}</span>
    <span class="category-meta">${category.apps.length} 项　⌄</span>
  `;

  category.apps.forEach(app => body.appendChild(makeApp(app)));

  head.onclick = () => {
    const hidden = body.style.display === "none";
    body.style.display = hidden ? "" : "none";
    head.querySelector(".category-meta").textContent =
      `${category.apps.length} 项　${hidden ? "⌄" : "›"}`;
  };

  box.append(head, body);
  return box;
}

function render(platforms){
  navRoot.innerHTML = "";
  appRoot.innerHTML = "";

  if(!platforms.length){
    appRoot.innerHTML =
      '<div class="empty">README.md 中没有识别到软件列表。</div>';
    return;
  }

  platforms.forEach((platform, index) => {
    const id = slug(platform.name) + "-" + index;

    const nav = document.createElement("a");
    nav.className = "nav-link";
    nav.href = "#" + id;
    nav.textContent = platform.name;
    navRoot.appendChild(nav);

    const section = document.createElement("section");
    section.className = "platform";
    section.id = id;

    const total =
      platform.categories.reduce((n,c) => n + c.apps.length, 0) +
      platform.loose.length;

    section.innerHTML = `
      <h2 class="platform-title">
        ${escapeHtml(platform.name)}
        <span class="count">${total} 项</span>
      </h2>
    `;

    const content = document.createElement("div");
    content.className = "content-grid";

    platform.categories.forEach(category => {
      content.appendChild(makeCategory(category));
    });

    section.appendChild(content);

    // 没有分类的软件直接和分类卡片同级显示
    if(platform.loose.length){
      const looseGrid = document.createElement("div");
      looseGrid.className = "loose-grid";

      platform.loose.forEach(item => {
        const el = makeApp(item);
        el.classList.add("top-level-app");
        looseGrid.appendChild(el);
      });

      section.appendChild(looseGrid);
    }

    appRoot.appendChild(section);
  });
}

function allSearchText(platforms){
  return [...document.querySelectorAll(".platform")];
}

searchInput.addEventListener("input", () => {
  const keyword = cleanText(searchInput.value).toLowerCase();

  document.querySelectorAll(".platform").forEach(platform => {
    let visible = 0;

    platform.querySelectorAll(".category").forEach(category => {
      const matched =
        category.textContent.toLowerCase().includes(keyword);

      category.style.display = matched ? "" : "none";
      if(matched) visible++;
    });

    platform.querySelectorAll(".top-level-app").forEach(item => {
      const matched =
        item.textContent.toLowerCase().includes(keyword);

      item.style.display = matched ? "" : "none";
      if(matched) visible++;
    });

    platform.style.display = visible || !keyword ? "" : "none";
  });
});

async function loadREADME(){
  appRoot.innerHTML =
    '<div class="loading">正在读取 GitHub README.md……</div>';

  try{
    const response = await fetch(
      README_URL + "?t=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error(`HTTP ${response.status}`);
    }

    const markdown = await response.text();
    const platforms = parseREADME(markdown);
    render(platforms);

  }catch(error){
    console.error(error);
    appRoot.innerHTML = `
      <div class="error">
        <strong>README.md 加载失败</strong>
        <p>无法读取 GitHub 仓库中的 README.md。</p>
        <p>请检查网络连接，或稍后刷新页面。</p>
      </div>`;
  }
}

loadREADME();
</script>
</body>
</html>
