<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppList · 软件资源列表</title>
<meta name="description" content="Android、Android TV、Windows 及 Root / Xposed 软件资源列表">
<meta name="theme-color" content="#f7f8fa">
<link rel="icon" href="./icon/ai.png"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>
:root{
  --bg:#f7f8fa;
  --card:#fff;
  --text:#202124;
  --sub:#6b7280;
  --line:#e5e7eb;
  --primary:#2563eb;
  --hover:#f1f5f9;
  --shadow:0 4px 16px rgba(0,0,0,.05);
  --radius:14px;
}

[data-theme="dark"]{
  --bg:#111315;
  --card:#1a1d20;
  --text:#f3f4f6;
  --sub:#9ca3af;
  --line:#30343a;
  --primary:#60a5fa;
  --hover:#252a30;
  --shadow:0 4px 18px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(16px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  height:64px;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  white-space:nowrap;
}

.logo img{
  width:34px;
  height:34px;
  border-radius:9px;
}

.search{
  flex:1;
  max-width:500px;
  margin-left:auto;
}

.search input{
  width:100%;
  height:40px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  color:var(--text);
  background:var(--card);
}

.search input:focus{
  border-color:var(--primary);
}

.header-btn{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero{
  max-width:1200px;
  margin:auto;
  padding:55px 20px 35px;
}

.hero h1{
  margin:0 0 12px;
  font-size:40px;
  line-height:1.2;
}

.hero p{
  margin:0;
  color:var(--sub);
  font-size:16px;
}

.nav{
  position:sticky;
  top:64px;
  z-index:10;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(12px);
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:10px 20px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.nav a{
  flex:none;
  padding:8px 13px;
  border-radius:9px;
  color:var(--sub);
  font-size:14px;
}

.nav a:hover{
  background:var(--hover);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:35px 20px 70px;
}

.platform{
  scroll-margin-top:130px;
  margin-bottom:55px;
}

.platform-title{
  margin:0 0 20px;
  font-size:28px;
}

.platform-body{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.category{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.category-title{
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  font-size:19px;
  font-weight:700;
}

.category-body{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.app{
  display:block;
  padding:17px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  transition:.18s;
}

.app:hover{
  transform:translateY(-2px);
  border-color:var(--primary);
  background:var(--hover);
}

.app-title{
  font-weight:650;
  margin-bottom:7px;
}

.app-desc{
  color:var(--sub);
  font-size:14px;
  line-height:1.6;
  word-break:break-word;
}

.top-level-app{
  display:block;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
  padding:20px;
}

.top-level-app:hover{
  border-color:var(--primary);
  background:var(--hover);
}

.top-level-app .app-title{
  font-size:19px;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--sub);
}

.error{
  max-width:800px;
  margin:50px auto;
  padding:25px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--sub);
}

.loading{
  padding:50px 20px;
  text-align:center;
  color:var(--sub);
}

@media(max-width:700px){
  .header-inner{
    padding:0 14px;
  }

  .logo span{
    display:none;
  }

  .search{
    max-width:none;
  }

  .hero{
    padding:40px 16px 28px;
  }

  .hero h1{
    font-size:32px;
  }

  .container{
    padding:28px 16px 60px;
  }

  .category-body{
    grid-template-columns:1fr;
  }

  .nav-inner{
    padding-left:16px;
    padding-right:16px;
  }
}
</style></head><body><header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <img src="./icon/ai.png" alt="AppList">
      <span>AppList</span>
    </a><div class="search">
  <input id="search" type="search" placeholder="搜索应用、工具、模块…">
</div>

<a
  class="header-btn"
  href="https://github.com/Easyllls/AppList"
  target="_blank"
  rel="noopener"
  title="GitHub"
>↗</a>

<button class="header-btn" id="theme" title="切换主题">☾</button>

  </div>
</header><section class="hero">
  <h1>AppList</h1>
  <p>Android、Android TV、Windows 及 Root / Xposed 软件资源列表</p>
</section><nav class="nav">
  <div class="nav-inner" id="platformNav"></div>
</nav><main class="container" id="content">
  <div class="loading">正在加载 README.md…</div>
</main><script>
const README_URL =
  "https://raw.githubusercontent.com/Easyllls/AppList/main/README.md";

const REPO_URL =
  "https://github.com/Easyllls/AppList";

const content = document.getElementById("content");
const platformNav = document.getElementById("platformNav");
const search = document.getElementById("search");
const theme = document.getElementById("theme");

function escapeHtml(str){
  return str.replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function cleanText(str){
  return str
    .replace(/!.*?.*?/g,"")
    .replace(/([^]+)\][^)]+/g,"$1")
    .replace(/`/g,"")
    .trim();
}

function parseList(ul){
  const categories=[];
  const loose=[];

  [...ul.children].forEach(li=>{
    if(li.tagName!=="LI") return;

    const nested=li.querySelector(":scope > ul, :scope > ol");
    const clone=li.cloneNode(true);

    if(nested){
      clone.querySelector(":scope > ul, :scope > ol")?.remove();

      const title=cleanText(clone.textContent);
      const apps=[];

      [...nested.children].forEach(item=>{
        if(item.tagName!=="LI") return;

        const link=item.querySelector("a");
        const itemClone=item.cloneNode(true);
        itemClone.querySelector(":scope > ul, :scope > ol")?.remove();

        const name=cleanText(
          link ? link.textContent : itemClone.textContent
        );

        const href=link?.href || "#";

        if(name){
          apps.push({
            name,
            href,
            text:cleanText(itemClone.textContent)
          });
        }
      });

      if(title){
        categories.push({
          name:title,
          apps
        });
      }
    }else{
      const link=li.querySelector("a");
      const name=cleanText(link ? link.textContent : li.textContent);

      if(name){
        loose.push({
          name,
          href:link?.href || "#",
          text:cleanText(li.textContent)
        });
      }
    }
  });

  return {categories,loose};
}

function parseREADME(markdown){
  const html=marked.parse(markdown);
  const wrapper=document.createElement("div");
  wrapper.innerHTML=html;

  const platforms=[];
  let current=null;

  [...wrapper.children].forEach(el=>{
    if(/^H[1-6]$/.test(el.tagName)){
      const level=Number(el.tagName.substring(1));
      const name=cleanText(el.textContent);

      if(level===1 || !current){
        current={
          name,
          list:null,
          categories:[],
          loose:[]
        };
        platforms.push(current);
      }

      return;
    }

    if((el.tagName==="UL" || el.tagName==="OL") && current){
      current.list=el;
      const parsed=parseList(el);
      current.categories=parsed.categories;
      current.loose=parsed.loose;
    }
  });

  if(!platforms.length){
    const lists=wrapper.querySelectorAll("ul,ol");

    lists.forEach((list,i)=>{
      const parsed=parseList(list);

      if(parsed.categories.length || parsed.loose.length){
        platforms.push({
          name:"AppList",
          categories:parsed.categories,
          loose:parsed.loose
        });
      }
    });
  }

  return platforms;
}

function makeApp(app){
  const el=document.createElement("a");
  el.className="app";
  el.href=app.href;
  el.target="_blank";
  el.rel="noopener";

  el.innerHTML=`
    <div class="app-title">${escapeHtml(app.name)}</div>
    ${
      app.text && app.text!==app.name
      ? `<div class="app-desc">${escapeHtml(app.text)}</div>`
      : ""
    }
  `;

  return el;
}

function makeCategory(category){
  const el=document.createElement("section");
  el.className="category";

  const title=document.createElement("div");
  title.className="category-title";
  title.textContent=category.name;

  const body=document.createElement("div");
  body.className="category-body";

  category.apps.forEach(app=>{
    body.appendChild(makeApp(app));
  });

  el.appendChild(title);
  el.appendChild(body);

  return el;
}

function render(platforms){
  content.innerHTML="";
  platformNav.innerHTML="";

  if(!platforms.length){
    content.innerHTML=`
      <div class="empty">
        没有识别到 README.md 内容
      </div>
    `;
    return;
  }

  platforms.forEach((platform,index)=>{
    const id=`platform-${index}`;

    const navLink=document.createElement("a");
    navLink.href="#"+id;
    navLink.textContent=platform.name;
    platformNav.appendChild(navLink);

    const section=document.createElement("section");
    section.className="platform";
    section.id=id;

    const title=document.createElement("h2");
    title.className="platform-title";
    title.textContent=platform.name;

    const body=document.createElement("div");
    body.className="platform-body";

    platform.categories.forEach(category=>{
      body.appendChild(makeCategory(category));
    });

    platform.loose.forEach(app=>{
      const el=makeApp(app);
      el.classList.add("top-level-app");
      body.appendChild(el);
    });

    section.appendChild(title);
    section.appendChild(body);
    content.appendChild(section);
  });
}

async function loadREADME(){
  const url=README_URL+"?t="+Date.now();

  const res=await fetch(url,{
    cache:"no-store"
  });

  if(!res.ok){
    throw new Error(
      `README.md 加载失败：HTTP ${res.status}`
    );
  }

  const text=await res.text();

  if(!text.trim()){
    throw new Error("README.md 内容为空");
  }

  return text;
}

async function init(){
  try{
    const markdown=await loadREADME();
    const platforms=parseREADME(markdown);
    render(platforms);
  }catch(error){
    console.error(error);

    content.innerHTML=`
      <div class="error">
        <strong>README.md 加载失败</strong>
        <p>${escapeHtml(error.message)}</p>
        <p>
          请检查 GitHub 仓库中的 README.md 是否存在，
          或稍后刷新页面重试。
        </p>
        <a
          href="${REPO_URL}"
          target="_blank"
          rel="noopener"
        >
          打开 GitHub 仓库 ↗
        </a>
      </div>
    `;
  }
}

search.addEventListener("input",()=>{
  const keyword=search.value.trim().toLowerCase();

  document.querySelectorAll(".category,.top-level-app")
    .forEach(el=>{
      el.style.display=
        !keyword || el.textContent.toLowerCase().includes(keyword)
        ? ""
        : "none";
    });
});

function applyTheme(){
  const saved=localStorage.getItem("applist-theme");

  if(saved==="dark"){
    document.documentElement.dataset.theme="dark";
    theme.textContent="☀";
  }else{
    document.documentElement.removeAttribute("data-theme");
    theme.textContent="☾";
  }
}

theme.addEventListener("click",()=>{
  const dark=document.documentElement.dataset.theme==="dark";

  if(dark){
    localStorage.setItem("applist-theme","light");
  }else{
    localStorage.setItem("applist-theme","dark");
  }

  applyTheme();
});

applyTheme();
init();
</script></body>
</html>
