<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppList · 软件资源列表</title>
<meta name="description" content="Android、Android TV、Windows 及 Root / Xposed 软件资源列表">
<meta name="theme-color" content="#f7f8fa">
<link rel="icon" href="./icon/ai.png">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--card2:#fafbfc;--text:#17191d;--sub:#69717d;
  --muted:#9aa2ad;--line:#e7e9ed;--blue:#2563eb;--blue-bg:#eff6ff;
  --shadow:0 8px 30px rgba(20,30,50,.055);--shadow2:0 14px 38px rgba(20,30,50,.09);
  --radius:18px;--header:62px;
}
html.dark{
  --bg:#0d1117;--card:#151a21;--card2:#11161c;--text:#f1f5f9;--sub:#9aa6b2;
  --muted:#66717e;--line:#27303b;--blue:#60a5fa;--blue-bg:rgba(37,99,235,.14);
  --shadow:0 8px 30px rgba(0,0,0,.22);--shadow2:0 16px 42px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(circle at 50% -10%,rgba(37,99,235,.09),transparent 32rem),
  var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.6;
}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
.header{
  position:sticky;top:0;z-index:1000;height:var(--header);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.header-inner,.main,.hero,.footer,.nav-inner{width:min(1320px,calc(100% - 32px));margin:auto}
.header-inner{height:100%;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:cover}
.search{position:relative;flex:1;max-width:540px;margin:auto}
.search input{
  width:100%;height:40px;padding:0 15px 0 40px;border:1px solid var(--line);
  border-radius:12px;background:var(--card2);color:var(--text);outline:none;
}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.search span{position:absolute;left:14px;top:7px;color:var(--muted);font-size:20px}
.actions{display:flex;gap:7px}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--sub);display:grid;place-items:center;cursor:pointer
}
.icon-btn:hover{color:var(--blue);border-color:var(--blue)}
.github-btn svg{width:20px;height:20px;display:block;fill:currentColor}
.hero{padding:58px 0 34px;text-align:center}
.hero-logo{width:72px;height:72px;border-radius:20px;box-shadow:0 12px 32px rgba(37,99,235,.14)}
.hero h1{margin:16px 0 7px;font-size:clamp(34px,5vw,52px);line-height:1.1;letter-spacing:-1.8px}
.hero p{margin:0;color:var(--sub);font-size:15px}
.hero-tags{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:17px}
.hero-tags span{
  padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  color:var(--sub);background:var(--card);font-size:12px
}
.nav{
  position:sticky;top:var(--header);z-index:900;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 91%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.nav-inner{display:flex;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav a{padding:13px 16px;color:var(--sub);font-size:14px;font-weight:650;white-space:nowrap;position:relative}
.nav a:hover,.nav a.active{color:var(--blue)}
.nav a.active:after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:2px;background:var(--blue);border-radius:2px}
.main{padding:30px 0 70px}
.loading,.error,.empty{padding:60px 20px;text-align:center;color:var(--sub)}
.error{color:#dc2626}
.platform{scroll-margin-top:132px;margin-bottom:52px}
.platform-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.platform-title{display:flex;align-items:center;gap:11px}
.platform-title h2{margin:0;font-size:27px;letter-spacing:-.7px}
.platform-title .dot{width:8px;height:28px;border-radius:99px;background:var(--blue)}
.collapse{
  width:34px;height:34px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--sub);cursor:pointer
}
.platform.collapsed .platform-body{display:none}
.platform.collapsed .collapse{transform:rotate(-90deg)}
.category{margin:0 0 25px;scroll-margin-top:140px}
.category-card{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  box-shadow:var(--shadow);overflow:hidden
}
.category-head{
  min-height:58px;padding:15px 19px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--card),var(--card2))
}
.category-title{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:750}
.category-title:before{content:"";width:4px;height:19px;background:var(--blue);border-radius:99px}
.items{display:block}
.app{
  padding:17px 19px;border-bottom:1px solid var(--line);
  transition:background .18s
}
.app:last-child{border-bottom:0}
.app:hover{background:var(--card2)}
.app-top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}
.app-name{font-size:16px;font-weight:750;line-height:1.4}
.app-desc{margin-top:5px;color:var(--sub);font-size:13px;line-height:1.65}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.url-tag{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;
  border:1px solid rgba(37,99,235,.22);border-radius:8px;
  color:var(--blue);background:var(--blue-bg);font-size:12px;font-weight:650;
  transition:.18s
}
.url-tag:hover{background:var(--blue);color:#fff;border-color:var(--blue);transform:translateY(-1px)}
.url-tag .arrow{font-size:11px;opacity:.7}
.loose-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.loose-grid .app{
  border:1px solid var(--line);border-radius:16px;background:var(--card);
  box-shadow:var(--shadow)
}
.no-results{display:none;padding:70px 20px;text-align:center;color:var(--sub)}
.no-results.show{display:block}
.hidden{display:none!important}
.footer{border-top:1px solid var(--line);padding:28px 0 40px;text-align:center;color:var(--muted);font-size:12px}
.footer a{color:var(--sub)}
#source{display:none}
@media(max-width:700px){
  .header-inner,.main,.hero,.footer,.nav-inner{width:calc(100% - 20px)}
  .brand span{display:none}.search{max-width:none}
  .hero{padding:42px 0 28px}.hero-logo{width:64px;height:64px}
  .hero h1{font-size:37px}.hero p{font-size:13px}
  .nav a{padding:12px 13px}
  .main{padding-top:24px}
  .platform-title h2{font-size:24px}
  .category-head{padding:14px 15px}.app{padding:15px}
  .loose-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="brand" href="#"><img src="./icon/ai.png" alt=""><span>AppList</span></a>
    <div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索应用、分类、描述……" autocomplete="off"></div>
    <div class="actions">
      <a class="icon-btn github-btn" href="https://github.com/Easyllls/AppList" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.16c-3.2.69-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.24 3.32.95.1-.74.4-1.24.73-1.53-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.67.41.35.78 1.04.78 2.1v3.12c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
  </svg>
</a>
      <button class="icon-btn" id="theme" title="切换主题">☼</button>
    </div>
  </div>
</header>

<section class="hero">
  <img class="hero-logo" src="./icon/ai.png" alt="AppList">
  <h1>AppList</h1>
  <p>Android、Android TV、Windows 及 Root / Xposed 生态软件资源列表</p>
  <div class="hero-tags"><span>Android</span><span>Android TV</span><span>Windows</span><span>Root</span><span>Xposed</span></div>
</section>

<nav class="nav"><div class="nav-inner" id="nav"></div></nav>

<main class="main">
  <div id="loading" class="loading">正在读取 README.md……</div>
  <div id="content"></div>
  <div id="empty" class="no-results">没有找到匹配的内容</div>
</main>

<footer class="footer">
  <div>数据来源：
    <a href="https://github.com/Easyllls/AppList" target="_blank" rel="noopener">Github@AppList</a>
  </div>
</footer>

<div id="source"></div>

<script>
"use strict";

const CONFIG={
  README_URL:"./README.md",
  GITHUB_URL:"https://github.com/Easyllls/AppList"
};

const $=s=>document.querySelector(s);
const loading=$("#loading"),content=$("#content"),nav=$("#nav"),empty=$("#empty"),search=$("#search");

marked.setOptions({gfm:true,breaks:true});

function abs(url){
  try{return new URL(url,location.href).href}catch{return url}
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function extractDirectLinks(element){
  const clone=element.cloneNode(true);
  Array.from(clone.querySelectorAll("ul, ol")).forEach(x=>x.remove());
  return Array.from(clone.querySelectorAll("a")).map(a=>({
    text:a.textContent.replace(/\s+/g," ").trim()||"链接",
    url:abs(a.getAttribute("href")||"")
  })).filter(x=>x.url);
}

function parseLine(li){
  const clone=li.cloneNode(true);
  Array.from(clone.children).filter(x=>x.tagName==="UL"||x.tagName==="OL").forEach(x=>x.remove());
  
  const rawText=clone.textContent.replace(/\s+/g," ").trim();
  const rawHTML=clone.innerHTML.trim();
  const links=extractDirectLinks(li);

  let name="", desc="";

  const sepMatch=rawText.match(/^(.+?)(?:[:：]|\s+-\s+|\s*[(（])\s*(.+?)[)）]?$/);
  
  if(sepMatch){
    name=sepMatch[1].trim();
    desc=sepMatch[2].trim();
  }else{
    name=rawText;
  }

  const strongEl=clone.querySelector("strong, b");
  if(strongEl&&strongEl.textContent.trim()){
    const boldText=strongEl.textContent.trim();
    if(rawText.startsWith(boldText)){
      name=boldText;
      desc=rawText.slice(boldText.length).replace(/^[:：\s-–—]+/, "").trim();
    }
  }

  if(links.length>0){
    if(!name||name===rawText){
      name=links[0].text;
    }
  }

  return {
    name:name||"未命名应用",
    desc:desc,
    links:links,
    html:rawHTML
  };
}

function parseList(ul){
  const categories=[], loose=[];

  Array.from(ul.children).filter(x=>x.tagName==="LI").forEach(li=>{
    const subList=Array.from(li.children).find(x=>x.tagName==="UL"||x.tagName==="OL");
    
    if(subList){
      const categoryInfo=parseLine(li);
      const subItems=parseList(subList);
      
      categories.push({
        name:categoryInfo.name,
        links:categoryInfo.links,
        children:[...subItems.loose,...subItems.categories.flatMap(c=>c.children)]
      });
    }else{
      loose.push(parseLine(li));
    }
  });

  return {categories,loose};
}

function parsePlatforms(root){
  const platforms=[];

  const detailsList=Array.from(root.querySelectorAll("details"));
  if(detailsList.length>0){
    detailsList.forEach((d,i)=>{
      const summary=d.querySelector(":scope > summary");
      const pName=summary?summary.textContent.trim():`平台 ${i+1}`;
      
      const mdContent=Array.from(d.childNodes)
        .filter(n=>n!==summary)
        .map(n=>n.nodeType===Node.TEXT_NODE?n.textContent:(n.outerHTML||""))
        .join("\n");

      const temp=document.createElement("div");
      temp.innerHTML=marked.parse(mdContent);

      const p={name:pName,categories:[],loose:[]};
      Array.from(temp.querySelectorAll(":scope > ul, :scope > ol")).forEach(ul=>{
        const parsed=parseList(ul);
        p.categories.push(...parsed.categories);
        p.loose.push(...parsed.loose);
      });

      if(p.categories.length||p.loose.length) platforms.push(p);
    });
    if(platforms.length) return platforms;
  }

  const headers=Array.from(root.querySelectorAll("h1, h2, h3, h4, h5, h6"));
  if(headers.length>0){
    headers.forEach(h=>{
      const pName=h.textContent.trim();
      const p={name:pName,categories:[],loose:[]};
      
      let next=h.nextElementSibling;
      while(next&&!headers.includes(next)){
        if(next.tagName==="UL"||next.tagName==="OL"){
          const parsed=parseList(next);
          p.categories.push(...parsed.categories);
          p.loose.push(...parsed.loose);
        }
        next=next.nextElementSibling;
      }

      if(p.categories.length||p.loose.length) platforms.push(p);
    });
    if(platforms.length) return platforms;
  }

  const fallbackPlatform={name:"全部应用与资源",categories:[],loose:[]};
  Array.from(root.children).filter(x=>x.tagName==="UL"||x.tagName==="OL").forEach(ul=>{
    const parsed=parseList(ul);
    fallbackPlatform.categories.push(...parsed.categories);
    fallbackPlatform.loose.push(...parsed.loose);
  });

  if(fallbackPlatform.categories.length||fallbackPlatform.loose.length){
    platforms.push(fallbackPlatform);
  }

  return platforms;
}

function tag(link){
  const a=document.createElement("a");
  a.className="url-tag";a.href=link.url;a.target="_blank";a.rel="noopener noreferrer";a.title=link.url;
  a.innerHTML=`<span>${esc(link.text)}</span><span class="arrow">↗</span>`;
  return a;
}
function linksEl(links){
  if(!links||!links.length)return null;
  const box=document.createElement("div");box.className="links";
  links.forEach(x=>box.appendChild(tag(x)));
  return box;
}
function appEl(app){
  const el=document.createElement("article");el.className="app";
  const top=document.createElement("div");top.className="app-top";
  const name=document.createElement("div");name.className="app-name";name.textContent=app.name;
  top.appendChild(name);el.appendChild(top);
  if(app.desc){const d=document.createElement("div");d.className="app-desc";d.textContent=app.desc;el.appendChild(d)}
  const ls=linksEl(app.links);if(ls)el.appendChild(ls);
  el.dataset.search=(app.name+" "+app.desc+" "+app.links.map(x=>x.text).join(" ")).toLowerCase();
  return el;
}
function categoryEl(c){
  const section=document.createElement("section");section.className="category";
  const card=document.createElement("div");card.className="category-card";
  const head=document.createElement("div");head.className="category-head";
  const title=document.createElement("div");title.className="category-title";title.textContent=c.name;
  head.appendChild(title);
  const categoryLinks=linksEl(c.links);if(categoryLinks)head.appendChild(categoryLinks);
  card.appendChild(head);
  const items=document.createElement("div");items.className="items";
  c.children.forEach(a=>items.appendChild(appEl(a)));
  card.appendChild(items);section.appendChild(card);
  section.dataset.search=(c.name+" "+c.children.map(a=>a.name+" "+a.desc).join(" ")).toLowerCase();
  return section;
}
function render(platforms){
  content.innerHTML="";nav.innerHTML="";
  platforms.forEach((p,i)=>{
    const id=`platform-${i}`;
    const n=document.createElement("a");n.href="#"+id;n.textContent=p.name;nav.appendChild(n);

    const sec=document.createElement("section");sec.className="platform";sec.id=id;
    const head=document.createElement("div");head.className="platform-head";
    const title=document.createElement("div");title.className="platform-title";
    title.innerHTML=`<span class="dot"></span><h2>${esc(p.name)}</h2>`;
    const btn=document.createElement("button");btn.className="collapse";btn.textContent="⌄";btn.title="展开 / 折叠";
    btn.onclick=()=>sec.classList.toggle("collapsed");
    head.append(title,btn);sec.appendChild(head);

    const body=document.createElement("div");body.className="platform-body";
    p.categories.forEach(c=>body.appendChild(categoryEl(c)));

    if(p.loose.length){
      const grid=document.createElement("div");grid.className="loose-grid";
      p.loose.forEach(a=>grid.appendChild(appEl(a)));
      body.appendChild(grid);
    }
    sec.appendChild(body);content.appendChild(sec);
  });
  observeNav();
}
function observeNav(){
  const sections=Array.from(document.querySelectorAll(".platform"));
  const links=Array.from(nav.querySelectorAll("a"));
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id));
      }
    });
  },{rootMargin:"-25% 0px -65% 0px"});
  sections.forEach(s=>io.observe(s));
}
function doSearch(){
  const q=search.value.trim().toLowerCase();
  let count=0;
  document.querySelectorAll(".platform").forEach(p=>{
    let platformHas=false;
    p.querySelectorAll(".category,.loose-grid .app").forEach(block=>{
      const text=(block.dataset.search||"").toLowerCase();
      const hit=!q||text.includes(q);
      block.classList.toggle("hidden",!hit);
      if(hit){platformHas=true;count++}
    });
    p.classList.toggle("hidden",!platformHas);
  });
  empty.classList.toggle("show",!!q&&!count);
}
search.addEventListener("input",doSearch);

$("#theme").onclick=()=>{
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("applist-theme",document.documentElement.classList.contains("dark")?"dark":"light");
};
if(localStorage.getItem("applist-theme")==="dark")document.documentElement.classList.add("dark");

async function load(){
  try{
    const res=await fetch(CONFIG.README_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!res.ok)throw new Error("README.md 加载失败："+res.status);
    const md=await res.text();
    const source=document.createElement("div");
    source.innerHTML=marked.parse(md);
    const platforms=parsePlatforms(source);
    if(!platforms.length)throw new Error("没有识别到 README.md 内容");
    render(platforms);
    loading.remove();
  }catch(e){
    loading.className="error";loading.textContent=e.message||"加载失败";
  }
}
load();
</script>
</body>
</html>
