<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppList · 软件资源列表</title>
<meta name="description" content="Android、Android TV、Windows 及 Root / Xposed 软件资源列表">
<link rel="icon" href="./icon/ai.png">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#f7f8fa;
  --card:#fff;
  --text:#202124;
  --sub:#6b7280;
  --line:#e5e7eb;
  --primary:#2563eb;
  --hover:#f1f5f9;
  --shadow:0 4px 16px rgba(0,0,0,.05);
  --radius:14px
}
[data-theme=dark]{
  --bg:#111315;
  --card:#1a1d20;
  --text:#f3f4f6;
  --sub:#9ca3af;
  --line:#30343a;
  --primary:#60a5fa;
  --hover:#252a30;
  --shadow:0 4px 18px rgba(0,0,0,.25)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif
}
a{color:inherit;text-decoration:none}
button{font:inherit}
.header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(16px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--line)
}
.header-inner{
  max-width:1200px;
  height:64px;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:14px
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  white-space:nowrap
}
.logo img{width:34px;height:34px;border-radius:9px}
.search{flex:1;max-width:500px;margin-left:auto}
.search input{
  width:100%;
  height:40px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  color:var(--text);
  background:var(--card)
}
.search input:focus{border-color:var(--primary)}
.header-btn{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}
.hero{
  max-width:1200px;
  margin:auto;
  padding:55px 20px 35px
}
.hero h1{margin:0 0 12px;font-size:40px}
.hero p{margin:0;color:var(--sub)}
.nav{
  position:sticky;
  top:64px;
  z-index:10;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(12px)
}
.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:10px 20px;
  display:flex;
  gap:8px;
  overflow-x:auto
}
.nav a{
  flex:none;
  padding:8px 13px;
  border-radius:9px;
  color:var(--sub);
  font-size:14px
}
.nav a:hover{background:var(--hover);color:var(--text)}
.container{
  max-width:1200px;
  margin:auto;
  padding:35px 20px 70px
}
.platform{
  scroll-margin-top:130px;
  margin-bottom:55px
}
.platform-title{margin:0 0 20px;font-size:28px}
.platform-body{display:flex;flex-direction:column;gap:20px}
.category{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
  overflow:hidden
}
.category-title{
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  font-size:19px;
  font-weight:700
}
.category-body{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px
}
.app{
  display:block;
  padding:17px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  transition:.18s
}
.app:hover{
  transform:translateY(-2px);
  border-color:var(--primary);
  background:var(--hover)
}
.app-title{font-weight:650;margin-bottom:7px}
.app-desc{
  color:var(--sub);
  font-size:14px;
  line-height:1.6;
  word-break:break-word
}
.top-level-app{
  display:block;
  padding:20px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
  transition:.18s
}
.top-level-app:hover{
  border-color:var(--primary);
  background:var(--hover)
}
.top-level-app .app-title{font-size:19px}
.loading,.empty{
  padding:60px 20px;
  text-align:center;
  color:var(--sub)
}
.error{
  padding:25px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--sub)
}
@media(max-width:700px){
  .header-inner{padding:0 14px}
  .logo span{display:none}
  .search{max-width:none}
  .hero{padding:40px 16px 28px}
  .hero h1{font-size:32px}
  .container{padding:28px 16px 60px}
  .category-body{grid-template-columns:1fr}
  .nav-inner{padding-left:16px;padding-right:16px}
}
</style>
</head><body><header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <img src="./icon/ai.png" alt="AppList">
      <span>AppList</span>
    </a><div class="search">
  <input id="search" type="search" placeholder="搜索应用、分类、描述……">
</div>

<a
  class="header-btn"
  href="https://github.com/Easyllls/AppList"
  target="_blank"
  rel="noopener"
  title="GitHub"
>↗</a>

<button class="header-btn" id="theme" title="切换主题">☾</button>

  </div>
</header><section class="hero">
  <h1>AppList</h1>
  <p>Android、Android TV、Windows 及 Root / Xposed 生态软件资源列表</p>
</section><nav class="nav">
  <div class="nav-inner" id="platformNav"></div>
</nav><main class="container" id="content">
  <div class="loading">正在加载 README.md…</div>
</main><script>
const README_URL="https://raw.githubusercontent.com/Easyllls/AppList/main/README.md";
const content=document.getElementById("content");
const platformNav=document.getElementById("platformNav");
const search=document.getElementById("search");
const theme=document.getElementById("theme");

function cleanText(text){
  return text
    .replace(/\s+/g," ")
    .replace(/^[📱📺🪟🔧🧩🌐💻🖥️]+/u,"")
    .trim();
}

function escapeHtml(text){
  return text.replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function parseItem(li){
  const nested=li.querySelector(":scope > ul,:scope > ol");
  const link=li.querySelector(":scope > a");

  const clone=li.cloneNode(true);
  clone.querySelector(":scope > ul,:scope > ol")?.remove();

  const name=cleanText(
    link ? link.textContent : clone.textContent
  );

  return {
    name,
    href:link?.href || "#",
    text:cleanText(clone.textContent),
    nested
  };
}

function parseList(list){
  const categories=[];
  const loose=[];

  [...list.children].forEach(li=>{
    if(li.tagName!=="LI") return;

    const item=parseItem(li);

    if(!item.name) return;

    if(item.nested){
      const apps=[];

      [...item.nested.children].forEach(child=>{
        if(child.tagName!=="LI") return;

        const sub=parseItem(child);

        if(sub.name){
          apps.push({
            name:sub.name,
            href:sub.href,
            text:sub.text
          });
        }
      });

      categories.push({
        name:item.name,
        href:item.href,
        apps
      });
    }else{
      loose.push({
        name:item.name,
        href:item.href,
        text:item.text
      });
    }
  });

  return {categories,loose};
}

function parseREADME(markdown){
  const html=marked.parse(markdown);
  const wrapper=document.createElement("div");
  wrapper.innerHTML=html;

  const platforms=[];

  wrapper.querySelectorAll("details").forEach(details=>{
    const summary=details.querySelector(":scope > summary");
    const list=details.querySelector(":scope > ul,:scope > ol");

    if(!summary || !list) return;

    const name=cleanText(summary.textContent);
    const parsed=parseList(list);

    if(name){
      platforms.push({
        name,
        categories:parsed.categories,
        loose:parsed.loose
      });
    }
  });

  return platforms;
}

function makeApp(app,topLevel=false){
  const el=document.createElement("a");

  el.className=topLevel
    ? "top-level-app"
    : "app";

  el.href=app.href || "#";

  if(app.href && app.href!=="#"){
    el.target="_blank";
    el.rel="noopener";
  }

  let desc=app.text || "";

  if(desc===app.name){
    desc="";
  }

  el.innerHTML=`
    <div class="app-title">${escapeHtml(app.name)}</div>
    ${desc?`<div class="app-desc">${escapeHtml(desc)}</div>`:""}
  `;

  return el;
}

function makeCategory(category){
  const el=document.createElement("section");
  el.className="category";

  const title=document.createElement("div");
  title.className="category-title";
  title.textContent=category.name;

  const body=document.createElement("div");
  body.className="category-body";

  category.apps.forEach(app=>{
    body.appendChild(makeApp(app));
  });

  el.appendChild(title);
  el.appendChild(body);

  return el;
}

function render(platforms){
  content.innerHTML="";
  platformNav.innerHTML="";

  if(!platforms.length){
    content.innerHTML=`
      <div class="empty">
        没有找到匹配的内容
      </div>
    `;
    return;
  }

  platforms.forEach((platform,index)=>{
    const id="platform-"+index;

    const navLink=document.createElement("a");
    navLink.href="#"+id;
    navLink.textContent=platform.name;
    platformNav.appendChild(navLink);

    const section=document.createElement("section");
    section.className="platform";
    section.id=id;

    const title=document.createElement("h2");
    title.className="platform-title";
    title.textContent=platform.name;

    const body=document.createElement("div");
    body.className="platform-body";

    platform.categories.forEach(category=>{
      body.appendChild(makeCategory(category));
    });

    platform.loose.forEach(app=>{
      body.appendChild(makeApp(app,true));
    });

    section.appendChild(title);
    section.appendChild(body);
    content.appendChild(section);
  });
}

async function loadREADME(){
  const response=await fetch(
    README_URL+"?t="+Date.now(),
    {
      cache:"no-store",
      mode:"cors"
    }
  );

  if(!response.ok){
    throw new Error("README.md 加载失败："+response.status);
  }

  const text=await response.text();

  if(!text.trim()){
    throw new Error("README.md 内容为空");
  }

  return text;
}

async function init(){
  try{
    const markdown=await loadREADME();
    const platforms=parseREADME(markdown);
    render(platforms);
  }catch(error){
    console.error(error);

    content.innerHTML=`
      <div class="error">
        <strong>README.md 加载失败</strong>
        <p>${escapeHtml(error.message)}</p>
        <p>
          请刷新页面重试。
        </p>
      </div>
    `;
  }
}

search.addEventListener("input",()=>{
  const keyword=search.value.trim().toLowerCase();

  document
    .querySelectorAll(".category,.top-level-app")
    .forEach(el=>{
      el.style.display=
        !keyword ||
        el.textContent.toLowerCase().includes(keyword)
          ? ""
          : "none";
    });
});

function applyTheme(){
  const saved=localStorage.getItem("applist-theme");

  if(saved==="dark"){
    document.documentElement.dataset.theme="dark";
    theme.textContent="☀";
  }else{
    document.documentElement.removeAttribute("data-theme");
    theme.textContent="☾";
  }
}

theme.addEventListener("click",()=>{
  const dark=
    document.documentElement.dataset.theme==="dark";

  localStorage.setItem(
    "applist-theme",
    dark ? "light" : "dark"
  );

  applyTheme();
});

applyTheme();
init();
</script></body>
</html>
